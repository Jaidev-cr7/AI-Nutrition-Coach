[build]
builder = "NIXPACKS"

[deploy]
startCommand = "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/stats/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
PORT = "8000"
DEBUG = "False"
ALLOWED_HOSTS = ".railway.app,.railway.internal,localhost,127.0.0.1"
CORS_ALLOWED_ORIGINS = "https://your-frontend-domain.railway.app,http://localhost:5173"
